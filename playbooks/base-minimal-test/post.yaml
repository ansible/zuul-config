---
- hosts: all:!appliance*
  tasks:
    - name: unregister the node
      command: subscription-manager unregister
      when: ansible_distribution == "RedHat"
      become: true
      ignore_errors: yes

    - block:
        - include_role: name=fetch-output
      when:
        - "ansible_connection != 'kubectl'"
        - ansible_user_dir is defined
    - block:
        - include_role: name=fetch-output-openshift
      when:
        - "ansible_connection == 'kubectl'"
        - ansible_user_dir is defined
    - import_role: name=merge-output-to-logs
      when: ansible_user_dir is defined

- hosts: localhost
  gather_facts: false
  tasks:
    - name: Run Zuul manifest role
      include_role:
        name: generate-zuul-manifest

    - name: Set zuul-log-path fact
      include_role:
        name: set-zuul-log-path-fact
      vars:
        zuul_log_path_shard_build: true

    - name: Build log upload targets and run failover (S3 first, then Swift)
      block:
        - name: Set swift_target (Swift with random Rackspace region)
          ansible.builtin.set_fact:
            swift_target:
              - target: swift
                args:
                  zuul_log_partition: true
                  zuul_log_container: ansible
                  zuul_log_cloud_config: "{{ item }}"
                  zuul_log_delete_after: 7776000
          no_log: true
          with_random_choice:
            - "{{ rackspace_dfw_clouds_yaml }}"
            - "{{ rackspace_iad_clouds_yaml }}"
            - "{{ rackspace_ord_clouds_yaml }}"

        - name: Set s3_target
          ansible.builtin.set_fact:
            s3_target:
              - target: s3
                args:
                  zuul_log_bucket: zuul-logging
                  zuul_log_bucket_public: true
                  zuul_log_aws_access_key: "{{ zuul_logs_aws_s3.access_key_id }}"
                  zuul_log_aws_secret_key: "{{ zuul_logs_aws_s3.secret_access_key }}"
          no_log: true

        - name: Set zuul_log_targets (S3 first, then Swift)
          ansible.builtin.set_fact:
            targets: "{{ s3_target + swift_target }}"
          no_log: true

        - name: DIAGNOSTIC - check S3 egress reachability
          ansible.builtin.uri:
            url: https://zuul-logging.s3.amazonaws.com/
            method: HEAD
            status_code: [200, 403, 404]
            timeout: 15
          ignore_errors: true
          register: s3_egress_check

        - name: DIAGNOSTIC - report S3 egress result
          ansible.builtin.debug:
            var: s3_egress_check

        - name: DIAGNOSTIC - check boto3 availability on executor
          ansible.builtin.command: python3 -c "import boto3; print(boto3.__version__)"
          timeout: 15
          ignore_errors: true
          register: boto3_check

        - name: DIAGNOSTIC - report boto3 check result
          ansible.builtin.debug:
            var: boto3_check

        - name: DIAGNOSTIC - attempt S3 put with intentionally invalid credentials (boto3)
          ansible.builtin.command: |
            python3 -c "
            import boto3
            s3 = boto3.client('s3', aws_access_key_id='AKIAFAKEFAKEFAKEFAKE00', aws_secret_access_key='FAKESECRETVALUEDONOTUSE0000000000000000')
            s3.put_object(Bucket='zuul-logging', Key='diagnostic-test.txt', Body=b'test', ACL='public-read')
            "
          timeout: 30
          ignore_errors: true
          register: s3_boto3_fake_cred_test
          no_log: false

        - name: DIAGNOSTIC - report fake-credential test result
          ansible.builtin.debug:
            var: s3_boto3_fake_cred_test

        - name: DIAGNOSTIC - verify decrypted secret integrity (no exposure)
          ansible.builtin.command: |
            python3 -c "
            import hashlib
            import os
            print('access_key_id length:', len(os.environ.get('AWS_ACCESS_KEY_ID', '')))
            print('secret_access_key sha256:', hashlib.sha256(os.environ.get('AWS_SECRET_ACCESS_KEY', '').encode()).hexdigest())
            "
          environment:
            AWS_ACCESS_KEY_ID: "{{ zuul_logs_aws_s3.access_key_id }}"
            AWS_SECRET_ACCESS_KEY: "{{ zuul_logs_aws_s3.secret_access_key }}"
          timeout: 15
          ignore_errors: true
          register: s3_secret_checksum
          no_log: false

        - name: DIAGNOSTIC - report secret integrity check
          ansible.builtin.debug:
            var: s3_secret_checksum

        - name: Run upload-logs-failover role (S3 then Swift)
          no_log: true
          include_role:
            name: upload-logs-failover
          vars:
            zuul_log_targets: "{{ targets }}"
